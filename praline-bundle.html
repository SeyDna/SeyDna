<!-- Theme init — runs before render to prevent FOUC -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem('praline-theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) { /* localStorage blocked */ }
  })();
</script>

  :root {

    --sans:   'Manrope', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;

    --shadow-soft: 0 1px 2px rgba(60,40,22,.04), 0 12px 36px -12px rgba(60,40,22,.18);

  /* Ivory palette variant */
  [data-palette="ivory"] {
    --bg:#F8F4EB; --bg-2:#F0E9D9; --paper:#FFFCF5;
    --ink:#23170B; --ink-soft:#574431; --ink-mute:#8a7558;
    --accent:#7A5436; --accent-2:#BFA079;

  /* Amber palette variant */
  [data-palette="amber"] {
    --bg:#EFE2CC; --bg-2:#E3D2B4; --paper:#F6ECD8;

    --accent:#A26333; --accent-2:#D29E66;

    --bg:#E9DFCE; --bg-2:#D6C6AC; --paper:#F3EAD8;

    --accent:#6B4423; --accent-2:#B08864;

  [data-theme="dark"] {
    --bg:        #1A0F08;   /* deep espresso */
    --bg-2:      #241712;   /* warm cocoa */
    --paper:     #2B1D15;   /* slightly elevated surface */
    --ink:       #EBDCC4;   /* soft cream */
    --ink-soft:  #C8B59A;   /* dimmed ivory */

    --shadow-lift: 0 2px 6px rgba(0,0,0,.5),  0 28px 60px -20px rgba(0,0,0,.85);
  }

     so they don't disappear into the espresso bg. */
  [data-theme="dark"] footer {
    background: #0D0805 !important;
    color: #C8B59A !important;
  }
  [data-theme="dark"] section[id="reserver"] {
    background: #0D0805 !important;
  }
  /* Nav glass when scrolled — re-tint to dark blur instead of cream */
  [data-theme="dark"] header[style*="rgba(244,237,224"] {
    background: rgba(26,15,8,0.78) !important;
  }
  /* Stamp on hero image — keep light but slightly less bright on dark */
  [data-theme="dark"] [style*="rgba(255,255,255,.7)"] {
    border-color: rgba(235,220,196,0.55) !important;
  }
  /* Grain texture: in light mode it multiplies brown noise onto cream.

  [data-theme="dark"] .grain-overlay {
    mix-blend-mode: overlay !important;
    opacity: 0.05 !important;
  }
  /* Smooth theme transition — avoid jolt when switching */
  html { transition: background-color .6s ease; }
  body { transition: background-color .6s ease, color .6s ease; }
  header, section, footer, article, [class*="reveal"] {
    transition: background-color .6s ease, color .6s ease, border-color .6s ease;
  }
  /* But not during scroll-reveal (would conflict with opacity transitions) */
  .reveal { transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body { margin:0; padding:0; }

  button { font: inherit; cursor: pointer; }

  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.005em; }
  .eyebrow {
    font-family: var(--sans);

    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink-soft);
  }

  }

  /* Page container */
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .wrap { padding: 0 22px; } }

  /* Scroll reveal */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .reveal.d1 { transition-delay: .08s; }
  .reveal.d2 { transition-delay: .16s; }
  .reveal.d3 { transition-delay: .24s; }
  .reveal.d4 { transition-delay: .32s; }

  /* Smooth scaling images */
  .zoom { overflow: hidden; }
  .zoom > img { transition: transform 1.4s cubic-bezier(.2,.7,.2,1); will-change: transform; }
  .zoom:hover > img { transform: scale(1.04); }

  /* Marquee */
  @keyframes drift {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Subtle blink for hours dot */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* Hide horizontal scrollbars */
  .scroller::-webkit-scrollbar { display:none; }
  .scroller { scrollbar-width: none; }

  /* ───────── Mobile-first optimizations ───────── */
  /* Tap targets baseline */
  button, a[role="button"], .tap { -webkit-tap-highlight-color: transparent; }
  /* Disable hover-zoom on touch devices */
  @media (hover: none) {
    .zoom:hover > img { transform: none; }
  }
  /* Soften heavy reveal motion on small/low-power devices */
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
    .zoom > img { transition: none !important; }
  }

  @media (max-width: 720px) {
    body { font-size: 15px; line-height: 1.6; }
    .eyebrow { font-size: 10px; letter-spacing: 0.18em; }

    section[style*="padding: '160px"],
    section[style*="padding:'140px"],
    section[style*="padding: '140px"],
    section[style*="padding:'120px"],

    }

    a[style*="border-radius: 999"],
    button[style*="border-radius: 999"] { min-height: 44px; }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,

});

// ─── Reveal-on-scroll hook ───────────────────────────────────────────────────
function useReveal() {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {if (e.isIntersecting) {e.target.classList.add('in');io.unobserve(e.target);}});
    }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

// ─── Theme toggle — refined sun/moon, integrated into nav ────────────────────
function useTheme() {
  const [theme, setTheme] = React.useState(() => {
    if (typeof document === 'undefined') return 'light';
    return document.documentElement.getAttribute('data-theme') || 'light';
  });
  const toggle = React.useCallback(() => {
    setTheme(prev => {
      const next = prev === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('praline-theme', next); } catch (e) {}
      return next;
    });
  }, []);
  return [theme, toggle];
}

function ThemeToggle({ size = 36, inline = false }) {

// ═══ Motion helper — fades children in on inView with spring ═════════════════
function MotionIn({ as = 'div', children, delay = 0, y = 24, ...rest }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!ref.current || !M) return;
    const el = ref.current;
    el.style.opacity = '0';
    el.style.transform = `translateY(${y}px)`;
    const stop = M.inView(el, () => {
      M.animate(el,
        { opacity: [0, 1], transform: [`translateY(${y}px)`, 'translateY(0px)'] },
        { duration: 0.9, delay, easing: [0.2, 0.7, 0.2, 1] }
      );
      return () => {};
    }, { amount: 0.15 });
    return () => stop && stop();
  }, [delay, y]);
  const Tag = as;
  return <Tag ref={ref} {...rest}>{children}</Tag>;
}

function MenuRow({ dish, delay = 0 }) {
  const ref = React.useRef(null);
  const [open, setOpen] = React.useState(false);
  const previewRef = React.useRef(null);

  React.useEffect(() => {
    if (!ref.current || !M) return;
    const el = ref.current;
    el.style.opacity = '0';
    el.style.transform = 'translateY(14px)';
    M.animate(el, { opacity:[0,1], transform:['translateY(14px)','translateY(0)'] },
      { duration: 0.6, delay, easing: [0.2,0.7,0.2,1] });
  }, [delay]);

  const tagColor = ({
    iconique:  'var(--ink)',
    nouveau:   '#5ea16a',
    signature: 'var(--accent)',
    limité:    'var(--rose)',
    'épuisé':  'var(--ink-mute)',
  })[dish.tag];

  return (
    <article
      ref={ref}
      className="menu-row"
      onMouseEnter={() => setOpen(true)}
      onMouseLeave={() => setOpen(false)}
      onClick={() => setOpen(o => !o)}
      style={{
        position:'relative',
        display:'grid', gridTemplateColumns:'80px 1fr 110px', gap: 24,
        alignItems:'center', padding:'28px 8px',
        borderBottom:'1px solid var(--line)',
        cursor:'pointer', minHeight: 64,
      }}
    >
      {/* Hover preview image */}
      <div ref={previewRef} aria-hidden="true" style={{
        position:'absolute', right: 130, top: '50%',
        width: 220, height: 160, pointerEvents:'none',
        transform: open ? 'translateY(-50%) rotate(-3deg) scale(1)' : 'translateY(-30%) rotate(-3deg) scale(0.85)',
        opacity: open ? 1 : 0,
        transition:'opacity .35s ease, transform .45s cubic-bezier(.2,.7,.2,1)',
        boxShadow:'var(--shadow-lift)', overflow:'hidden',
        zIndex: 3, background:'var(--bg-2)',
      }} className="menu-preview">
        <img src={dish.photo} alt="" loading="lazy" decoding="async" style={{ width:'100%', height:'100%', objectFit:'cover' }} />
      </div>

      <div className="serif" style={{
        fontFamily:'var(--serif)', fontStyle:'italic', fontSize: 18,
        color:'var(--ink-mute)', letterSpacing:'0.02em',
      }}>
        № {String(dish.name.length).padStart(2,'0')}
      </div>

      <div style={{ display:'flex', flexDirection:'column', gap: 6 }}>
        <div style={{ display:'flex', alignItems:'baseline', gap: 14, flexWrap:'wrap' }}>
          <h3 className="serif" style={{
            fontFamily:'var(--serif)', fontSize: 'clamp(22px, 2.6vw, 32px)', margin: 0,
            fontWeight: 400, letterSpacing:'-0.01em', lineHeight: 1.1,
            color:'var(--ink)',
            transition:'color .25s ease',
          }}>{dish.name}</h3>
          {dish.tag && (
            <span style={{
              fontSize: 10, fontFamily:'var(--sans)', fontWeight: 500, letterSpacing:'0.18em', textTransform:'uppercase',
              color: tagColor, border:`1px solid ${tagColor}`, padding:'2px 8px', borderRadius: 999,
            }}>{dish.tag}</span>
          )}
        </div>
        <p style={{ fontSize: 13.5, color:'var(--ink-soft)', margin: 0, lineHeight: 1.6, maxWidth: 560 }}>
          {dish.desc}
        </p>
      </div>

      <div style={{ textAlign:'right' }}>
        <div className="serif" style={{
          fontFamily:'var(--serif)', fontSize: 20, color: open ? 'var(--accent)' : 'var(--ink)',
          fontVariantNumeric:'tabular-nums', letterSpacing:'0.02em',
          transition:'color .25s ease',
        }}>
          {dish.price.trim()} <span style={{ fontSize:11, color:'var(--ink-mute)', letterSpacing:'0.18em' }}>CFA</span>
        </div>
        <span style={{
          marginTop: 6, display:'inline-block', fontSize: 11, letterSpacing:'0.16em', textTransform:'uppercase',
          color: open ? 'var(--accent)' : 'var(--ink-mute)', fontWeight: 500,

      <style>{`

function IGTile({ post, delay }) {
  const ref = React.useRef(null);
  const [hov, setHov] = React.useState(false);
  React.useEffect(() => {
    if (!ref.current || !M) return;
    const el = ref.current;
    el.style.opacity = '0';
    el.style.transform = 'translateY(20px)';
    M.inView(el, () => {
      M.animate(el, { opacity:[0,1], transform:['translateY(20px)','translateY(0)'] },
        { duration: 0.7, delay, easing: [0.2,0.7,0.2,1] });
    }, { amount: 0.2 });
  }, [delay]);
  return (
    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"
      ref={ref}
      onMouseEnter={()=>setHov(true)}
      onMouseLeave={()=>setHov(false)}
      style={{
        position:'relative', aspectRatio:'1/1', overflow:'hidden', background:'var(--bg-2)',
        display:'block',
      }}>
      <img src={post.src} alt={post.caption} style={{
        width:'100%', height:'100%', objectFit:'cover',
        transform: hov ? 'scale(1.06)' : 'scale(1)',
        transition:'transform 1s cubic-bezier(.2,.7,.2,1)',
      }} />
      <div style={{
        position:'absolute', inset: 0,
        background:'linear-gradient(180deg, transparent 30%, rgba(26,15,8,.78) 100%)',
        opacity: hov ? 1 : 0,
        transition:'opacity .35s ease',
        display:'flex', flexDirection:'column', justifyContent:'flex-end',
        padding: 18, color:'#F4EDE0',
      }}>
        <div style={{ fontSize: 12, fontFamily:'var(--serif)', fontStyle:'italic', marginBottom: 10, opacity: .92 }}>
          {post.caption}
        </div>
        <div style={{ display:'flex', gap: 16, fontSize: 12, fontWeight: 500, letterSpacing:'.04em' }}>
          <span style={{ display:'inline-flex', alignItems:'center', gap: 6 }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="#F4EDE0">
              <path d="M12 21s-7-4.35-7-10a4 4 0 0 1 7-2.65A4 4 0 0 1 19 11c0 5.65-7 10-7 10z"/>
            </svg>
            {post.likes}

          <span style={{ display:'inline-flex', alignItems:'center', gap: 6 }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#F4EDE0" strokeWidth="2">
              <path d="M21 12a8 8 0 0 1-12.7 6.5L3 20l1.5-5.3A8 8 0 1 1 21 12z"/>
            </svg>
            {post.comments}
          </span>
        </div>
      </div>
    </a>
  );
}

  return (
    <div style={{ position:'relative' }}>
      {t.showGrain && <Grain />}

      <Nav />
      <main>
        <Hero variant={t.hero} />
        <Marquee />
        <Signatures />
        <InteractiveMenu />
        <CTA kind="reserve" />
        <TestimonialBand />
      </main>
      <Footer />

      <WhatsAppButton />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Palette" />
        <TweakColor
          label="Mood"
          value={t.palette}
          options={[
            ['#F4EDE0','#8B5E3C','#2A1D10'],
            ['#F8F4EB','#7A5436','#23170B'],
            ['#EFE2CC','#A26333','#221404'],
            ['#E9DFCE','#6B4423','#1B1108'],
          ]}
          onChange={(v) => {
            const map = [
              ['cream',  ['#F4EDE0','#8B5E3C','#2A1D10']],
              ['ivory',  ['#F8F4EB','#7A5436','#23170B']],
              ['amber',  ['#EFE2CC','#A26333','#221404']],
              ['mocha',  ['#E9DFCE','#6B4423','#1B1108']],
            ];
            const match = map.find(([_, arr]) => JSON.stringify(arr) === JSON.stringify(v));
            setTweak('palette', match ? match[0] : 'cream');
          }}
        />
        <TweakSection label="Hero" />
        <TweakRadio label="Variant" value={t.hero}
          options={['split','centered','editorial']}
          onChange={(v) => setTweak('hero', v)} />
        <TweakSection label="Serif" />
        <TweakRadio label="Font" value={t.display}
          options={['cormorant','italiana','dmserif']}
          onChange={(v) => setTweak('display', v)} />
        <TweakSection label="Texture" />
        <TweakToggle label="Paper grain" value={t.showGrain}
          onChange={(v) => setTweak('showGrain', v)} />
      </TweaksPanel>
    </div>
  );
}

function Grain() {
  return (
    <div aria-hidden="true" className="grain-overlay" style={{
      position:'fixed', inset: 0, pointerEvents:'none', zIndex: 40,
      opacity: 0.06, mixBlendMode:'multiply',
      backgroundImage: 'url("data:image/svg+xml;utf8,' +
        encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.16 0 0 0 0 0.10 0 0 0 0 0.05 0 0 0 0.7 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>`) +
        '")',
    }}/>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

</body>
</html>
