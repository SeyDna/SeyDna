<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Praline — Pâtisserie d'auteur, Dakar</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Manrope:wght@300;400;500;600;700&family=Italiana&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

<style>
  :root {
    /* Palette — Cream (default) */
    --bg:        #F4EDE0;
    --bg-2:      #EDE3D2;
    --paper:     #FAF6EE;
    --ink:       #2A1D10;
    --ink-soft:  #5B4632;
    --ink-mute:  #8A7256;
    --line:      rgba(60,40,22,0.14);
    --line-2:    rgba(60,40,22,0.08);
    --accent:    #8B5E3C;     /* caramel */
    --accent-2:  #C9956A;     /* soft caramel */
    --rose:      #C77B6A;     /* hibiscus accent */

    --serif:  'Cormorant Garamond', 'DM Serif Display', 'Times New Roman', serif;
    --sans:   'Manrope', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', sans-serif;

    --shadow-soft: 0 1px 2px rgba(60,40,22,.04), 0 12px 36px -12px rgba(60,40,22,.18);
    --shadow-lift: 0 2px 6px rgba(60,40,22,.06), 0 28px 60px -20px rgba(60,40,22,.28);
  }

  /* Ivory palette variant */
  [data-palette="ivory"] {
    --bg:#F8F4EB; --bg-2:#F0E9D9; --paper:#FFFCF5;
    --ink:#23170B; --ink-soft:#574431; --ink-mute:#8a7558;
    --accent:#7A5436; --accent-2:#BFA079;
  }
  /* Amber palette variant */
  [data-palette="amber"] {
    --bg:#EFE2CC; --bg-2:#E3D2B4; --paper:#F6ECD8;
    --ink:#221404; --ink-soft:#5a3d1f; --ink-mute:#8a6c47;
    --accent:#A26333; --accent-2:#D29E66;
  }
  /* Mocha palette variant */
  [data-palette="mocha"] {
    --bg:#E9DFCE; --bg-2:#D6C6AC; --paper:#F3EAD8;
    --ink:#1B1108; --ink-soft:#4a3522; --ink-mute:#7c624a;
    --accent:#6B4423; --accent-2:#B08864;
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body { margin:0; padding:0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.55;
    overflow-x: hidden;
  }
  img { display:block; max-width:100%; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  ::selection { background: var(--ink); color: var(--paper); }

  .serif { font-family: var(--serif); font-weight: 400; letter-spacing: -0.005em; }
  .eyebrow {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 500;
    color: var(--ink-soft);
  }
  .rule {
    height: 1px; background: var(--line); border: 0; margin: 0;
  }

  /* Page container */
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px; }
  @media (max-width: 720px) { .wrap { padding: 0 22px; } }

  /* Scroll reveal */
  .reveal { opacity: 0; transform: translateY(22px); transition: opacity .9s cubic-bezier(.2,.7,.2,1), transform .9s cubic-bezier(.2,.7,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .reveal.d1 { transition-delay: .08s; }
  .reveal.d2 { transition-delay: .16s; }
  .reveal.d3 { transition-delay: .24s; }
  .reveal.d4 { transition-delay: .32s; }

  /* Smooth scaling images */
  .zoom { overflow: hidden; }
  .zoom > img { transition: transform 1.4s cubic-bezier(.2,.7,.2,1); will-change: transform; }
  .zoom:hover > img { transform: scale(1.04); }

  /* Marquee */
  @keyframes drift {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Subtle blink for hours dot */
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

  /* Hide horizontal scrollbars */
  .scroller::-webkit-scrollbar { display:none; }
  .scroller { scrollbar-width: none; }
</style>

<!-- Inline edit defaults persisted by tweaks panel -->
<script>
  window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "palette": "mocha",
    "hero": "split",
    "display": "cormorant",
    "showGrain": true
  }/*EDITMODE-END*/;
</script>
